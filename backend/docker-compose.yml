version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: giapha_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: gia_pha_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
